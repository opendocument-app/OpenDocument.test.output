<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8"/>
	<title>odr</title>
	<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes"/>
	<style>@media print{:root{--odr-zoom:1!important}body{zoom:1!important}}
	</style>
	<link rel="stylesheet" href="../../../resources/filesystem.css"/>
	<link rel="stylesheet" href="../../../resources/search.css"/>
</head>
<body>
	<table class="odr-files">
		<tbody>
			<tr>
				<td class="odr-files-name"><a href="hello.txt" title="hello.txt">/hello.txt</a></td>
				<td class="odr-files-size">14 B</td>
				<td class="odr-files-action"><a href="hello.txt" download="hello.txt" title="hello.txt">↓</a></td>
			</tr>
			<tr>
				<td class="odr-files-name"><a href="nested/note.txt" title="note.txt">/nested/note.txt</a></td>
				<td class="odr-files-size">33 B</td>
				<td class="odr-files-action"><a href="nested/note.txt" download="note.txt" title="note.txt">↓</a></td>
			</tr>
		</tbody>
	</table>
	<script type="text/javascript" src="../../../resources/search.js"></script>
	<script type="text/javascript" src="../../../resources/viewport.js"></script>
</body>
</html>
