<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8"/>
	<title>Types – Values</title>
	<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=yes"/>
	<style>@media print{:root{--odr-zoom:1!important;-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}body{zoom:1!important}}
	</style>
	<link rel="stylesheet" href="../../../resources/document.css"/>
	<link rel="stylesheet" href="../../../resources/search.css"/>
	<link rel="stylesheet" href="../../../resources/spreadsheet.css"/>
</head>
<body class="odr-body odr-gridlines-soft">
	<table class="odr-sheet">
		<col class="odr-sheet-gutter">
		<col>
		<col>
		<thead>
			<tr>
				<th class="odr-sheet-corner" style="width:calc(1ch + 14px);"></th>
				<th class="odr-sheet-column-header">A</th>
				<th class="odr-sheet-column-header">B</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<th class="odr-sheet-row-header">1</th>
				<td>
					<x-p style="display:block;"><x-s>Kind</x-s><wbr></x-p>
				</td>
				<td>
					<x-p style="display:block;"><x-s>Value</x-s><wbr></x-p>
				</td>
			</tr>
			<tr>
				<th class="odr-sheet-row-header">2</th>
				<td>
					<x-p style="display:block;"><x-s>text</x-s><wbr></x-p>
				</td>
				<td>
					<x-p style="display:block;"><x-s>A cell holding a rather longer piece of text</x-s><wbr></x-p>
				</td>
			</tr>
			<tr>
				<th class="odr-sheet-row-header">3</th>
				<td>
					<x-p style="display:block;"><x-s>number</x-s><wbr></x-p>
				</td>
				<td class="odr-value-type-float">
					<x-p style="display:block;"><x-s>-42</x-s><wbr></x-p>
				</td>
			</tr>
			<tr>
				<th class="odr-sheet-row-header">4</th>
				<td>
					<x-p style="display:block;"><x-s>boolean</x-s><wbr></x-p>
				</td>
				<td>
					<x-p style="display:block;"><x-s>TRUE</x-s><wbr></x-p>
				</td>
			</tr>
			<tr>
				<th class="odr-sheet-row-header">5</th>
				<td>
					<x-p style="display:block;"><x-s>date</x-s><wbr></x-p>
				</td>
				<td>
					<x-p style="display:block;"><x-s>2024-01-01T10:30:00Z</x-s><wbr></x-p>
				</td>
			</tr>
			<tr>
				<th class="odr-sheet-row-header">6</th>
				<td>
					<x-p style="display:block;"><x-s>duration</x-s><wbr></x-p>
				</td>
				<td>
					<x-p style="display:block;"><x-s>1h 30m</x-s><wbr></x-p>
				</td>
			</tr>
			<tr>
				<th class="odr-sheet-row-header">7</th>
				<td>
					<x-p style="display:block;"><x-s>empty</x-s><wbr></x-p>
				</td>
				<td>
				</td>
			</tr>
			<tr>
				<th class="odr-sheet-row-header">8</th>
				<td>
					<x-p style="display:block;"><x-s>percent</x-s><wbr></x-p>
				</td>
				<td class="odr-value-type-float">
					<x-p style="display:block;"><x-s>0.075</x-s><wbr></x-p>
				</td>
			</tr>
			<tr>
				<th class="odr-sheet-row-header">9</th>
				<td>
					<x-p style="display:block;"><x-s>two lines</x-s><wbr></x-p>
				</td>
				<td>
					<x-p style="display:block;"><x-s>line one
line two</x-s><wbr></x-p>
				</td>
			</tr>
		</tbody>
	</table>
	<script type="text/javascript" src="../../../resources/search.js"></script>
	<script type="text/javascript" src="../../../resources/document.js"></script>
	<script type="text/javascript" src="../../../resources/spreadsheet.js"></script>
	<script type="text/javascript" src="../../../resources/viewport.js"></script>
</body>
</html>
