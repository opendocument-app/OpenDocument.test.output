	<style>body{margin:0;background:#525659}.p{position:relative;margin:16px auto;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}.t{position:absolute;left:0;top:0;transform-origin:0 0;white-space:pre;line-height:1;font-kerning:none;font-variant-ligatures:none}.i{color:transparent}.g{user-select:none}.s{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
.x1{width:8.26811in}
.y1{height:11.6929in}

	<div class="p x1 y1">

	<script>(function(){if(!window.IntersectionObserver)return;var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;io.unobserve(e.target);var s=e.target.querySelectorAll('.sel span[data-w]'),n=s.length,w=new Array(n),f=new Array(n),i,k;for(i=0;i<n;i++){f[i]=getComputedStyle(s[i]).transform==='none';w[i]=s[i].getBoundingClientRect().width;}for(i=0;i<n;i++){if(f[i]&&w[i]>0){k=parseFloat(s[i].getAttribute('data-w'))/w[i];s[i].style.transform='scaleX('+k+')';}}})},{rootMargin:'200px'});document.querySelectorAll('.p').forEach(function(p){io.observe(p);});})();
	</script>
